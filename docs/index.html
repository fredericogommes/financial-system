<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · Finanças do Fred</title>
<link rel="stylesheet" href="css/style.css?v=20261029a">
</head>
<body>
<header class="topbar" id="topbar"></header>
<nav class="sidebar" id="sidebar"></nav>
<main class="conteudo">

  <div class="barra-acoes">
    <button class="btn btn-primario" onclick="abrirLancamento(null,{tipo:'receita'})">+ Receita</button>
    <button class="btn btn-escuro" onclick="abrirLancamento(null,{tipo:'despesa',status:'pendente'})">Registrar conta a pagar</button>
    <button class="btn" onclick="abrirLancamento(null,{tipo:'despesa'})">+ Despesa</button>
  </div>

  <div class="kpis" id="kpis"></div>

  <section class="dash-grade">
    <div class="painel">
      <div class="painel-topo">
        <div class="painel-titulo" id="titulo-ultimos"></div>
        <a class="btn-contorno" href="caixa.html">Ver todos</a>
      </div>
      <div id="ultimos"></div>
    </div>

    <div class="painel">
      <div class="painel-topo">
        <div class="painel-titulo" id="titulo-fluxo"></div>
        <select class="select-periodo" id="periodo">
          <option value="6">Últimos 6 meses</option>
          <option value="12">Últimos 12 meses</option>
          <option value="3">Últimos 3 meses</option>
        </select>
      </div>
      <div class="fluxo-wrap">
        <div class="fluxo-grafico">
          <div class="legenda">
            <span class="leg leg-verde">Entradas (R$)</span>
            <span class="leg leg-vermelho">Saídas (R$)</span>
          </div>
          <div class="caixa-grafico"><canvas id="gr-fluxo"></canvas></div>
        </div>
        <div class="fluxo-totais">
          <div class="total-box"><div class="total-rotulo">Total de entradas</div><div class="total-valor" id="total-entradas">R$ 0,00</div></div>
          <div class="total-box"><div class="total-rotulo">Total de saídas</div><div class="total-valor" id="total-saidas">R$ 0,00</div></div>
        </div>
      </div>
    </div>
  </section>

  <section class="dash-grade">
    <div class="painel">
      <div class="painel-topo">
        <div class="painel-titulo" id="titulo-vencimentos"></div>
        <div style="display:flex;gap:6px"><a class="btn-contorno" href="pagar.html">A pagar</a><a class="btn-contorno" href="receber.html">A receber</a></div>
      </div>
      <div id="vencimentos"></div>
    </div>

    <div class="painel">
      <div class="painel-topo">
        <div class="painel-titulo" id="titulo-alertas"></div>
      </div>
      <div class="alertas" id="alertas"></div>
    </div>
  </section>

</main>
<div id="aviso" hidden></div>
<script src="vendor/supabase.js"></script>
<script src="vendor/chart.umd.js"></script>
<script src="js/app.js?v=20261029a"></script>
<script src="js/index.js?v=20261029a"></script>
</body>
</html>
