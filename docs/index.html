<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · Finanças do Fred</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar" id="topbar"></header>
<nav class="sidebar" id="sidebar"></nav>
<main class="conteudo">
  <div class="cabecalho">
    <h1>Dashboard</h1>
    <div class="acoes">
      <button class="btn btn-primario" onclick="abrirLancamento(null,{tipo:'receita'})">+ Receita</button>
      <button class="btn btn-escuro" onclick="abrirLancamento(null,{tipo:'despesa'})">+ Despesa</button>
      <button class="btn" onclick="abrirLancamento(null,{tipo:'despesa',status:'pendente'})">+ Conta a pagar</button>
    </div>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="grade-3" style="margin-bottom:16px">
    <div class="card">
      <h2>Fluxo financeiro
        <select id="periodo" style="width:auto;margin-left:auto;padding:5px 9px;font-size:12px">
          <option value="6">Últimos 6 meses</option>
          <option value="12">Últimos 12 meses</option>
          <option value="3">Últimos 3 meses</option>
        </select>
      </h2>
      <canvas id="gr-fluxo" height="110"></canvas>
    </div>
    <div class="card">
      <h2>Despesas do mês por categoria</h2>
      <div id="categorias-mes"></div>
    </div>
  </div>

  <div class="grade-2">
    <div class="card">
      <h2>Próximos vencimentos <a class="btn-link" href="pagar.html">Ver contas a pagar</a></h2>
      <div id="vencimentos"></div>
    </div>
    <div class="card">
      <h2>Últimos lançamentos <a class="btn-link" href="caixa.html">Ver caixa</a></h2>
      <div id="ultimos"></div>
    </div>
  </div>

</main>
<div id="aviso" hidden></div>
<script src="vendor/supabase.js"></script>
<script src="vendor/chart.umd.js"></script>
<script src="js/app.js"></script>
<script src="js/index.js"></script>
</body>
</html>
