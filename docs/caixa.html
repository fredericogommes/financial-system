<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caixa · Finanças do Fred</title>
<link rel="stylesheet" href="css/style.css?v=20261029a">
</head>
<body>
<header class="topbar" id="topbar"></header>
<nav class="sidebar" id="sidebar"></nav>
<main class="conteudo">
  <div class="cabecalho">
    <h1>Caixa</h1>
    <div class="acoes">
      <button class="btn" id="exportar">Exportar CSV</button>
      <button class="btn btn-primario" onclick="abrirLancamento(null,{tipo:'despesa',status:'liquidado'})">+ Lançamento</button>
    </div>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="card">
    <div class="filtros">
      <div class="campo" style="flex:1"><label for="f-busca">Buscar</label><input id="f-busca" placeholder="descrição ou pessoa"></div>
      <div class="campo"><label for="f-de">Baixa de</label><input id="f-de" type="date"></div>
      <div class="campo"><label for="f-ate">Até</label><input id="f-ate" type="date"></div>
      <div class="campo"><label for="f-tipo">Movimento</label>
        <select id="f-tipo"><option value="">Entradas e saídas</option><option value="1">Só entradas</option><option value="-1">Só saídas</option></select></div>
    </div>
    <div class="filtros">
      <div class="campo"><label for="f-conta">Conta</label><select id="f-conta"></select></div>
      <div class="campo"><label for="f-categoria">Categoria</label><select id="f-categoria"></select></div>
      <div class="campo"><label for="f-pessoa">Pessoa</label><select id="f-pessoa"></select></div>
      <div class="campo"><label for="f-grupo">Origem</label>
        <select id="f-grupo"><option value="">Todas</option><option value="resultado">Receitas e despesas</option><option value="emprestimo">Empréstimos</option></select></div>
      <button class="btn" id="f-limpar">Limpar filtros</button>
    </div>
    <div class="chips" id="atalhos"></div>
    <div class="chips" id="ativos"></div>
    <div id="tabela"></div>
  </div>

</main>
<div id="aviso" hidden></div>
<script src="vendor/supabase.js"></script>

<script src="js/app.js?v=20261029a"></script>
<script src="js/caixa.js?v=20261029a"></script>
</body>
</html>
